
name: Oracle Cloud VM Auto Retry

on:
  schedule:
    # Every hour at minute 17 (UTC)
    - cron: "17 * * * *"

  # Allow manual execution
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-vm-retry
  cancel-in-progress: false

jobs:
  create-vm:
    name: Create Oracle ARM VM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
        OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
        OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_API_PRIVATE_KEY }}
        OCI_CLI_REGION: eu-zurich-1

        STACK_OCID: ${{ vars.OCI_STACK_OCID }}
        COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
        VM_NAME: factory-vm-1

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Oracle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install oci-cli
          oci --version

      - name: Verify Oracle authentication
        shell: bash
        run: |
          set -euo pipefail

          oci iam region-subscription list \
            --tenancy-id "$OCI_CLI_TENANCY" \
            --output json > /dev/null

          echo "Oracle authentication successful."

      - name: Check VM and retry if needed
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking VM: $VM_NAME"

          # Check whether the VM already exists
          INSTANCES=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_OCID" \
            --display-name "$VM_NAME" \
            --all \
            --output json)

          if jq -e '
            any(.data[];
              .["lifecycle-state"] != "TERMINATED"
            )
          ' <<< "$INSTANCES" > /dev/null; then

            echo "VM already exists."
            echo "No new instance needed."
            exit 0
          fi

          echo "VM does not exist."

          # Check for existing Resource Manager jobs
          JOBS=$(oci resource-manager job list \
            --stack-id "$STACK_OCID" \
            --all \
            --output json)

          if jq -e '
            any(.data[];
              .["lifecycle-state"] == "ACCEPTED" or
              .["lifecycle-state"] == "IN_PROGRESS" or
              .["lifecycle-state"] == "CANCELING"
            )
          ' <<< "$JOBS" > /dev/null; then

            echo "Another Resource Manager job is active."
            echo "Skipping this attempt."
            exit 0
          fi

          echo "No VM or active job found."
          echo "Starting Terraform Apply..."

          # Submit an apply job to existing stack
          JOB_ID=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_OCID" \
            --execution-plan-strategy AUTO_APPROVED \
            --query 'data.id' \
            --raw-output)

          echo "Job created: $JOB_ID"

          # Wait up to 20 minutes
          for i in $(seq 1 60); do

            STATE=$(oci resource-manager job get \
              --job-id "$JOB_ID" \
              --query 'data."lifecycle-state"' \
              --raw-output)

            echo "Attempt $i - Job state: $STATE"

            case "$STATE" in
              SUCCEEDED)
                echo "Terraform Apply succeeded!"
                echo "Checking Oracle VM..."

                INSTANCES=$(oci compute instance list \
                  --compartment-id "$COMPARTMENT_OCID" \
                  --display-name "$VM_NAME" \
                  --all \
                  --output json)

                if jq -e '
                  any(.data[];
                    .["lifecycle-state"] != "TERMINATED"
                  )
                ' <<< "$INSTANCES" > /dev/null; then
                  echo "SUCCESS: $VM_NAME exists!"
                  exit 0
                else
                  echo "Apply succeeded but VM was not found."
                  exit 1
                fi
                ;;

              FAILED|CANCELED)
                echo "Apply failed or was canceled."
                echo "Will retry on the next hourly run."
                exit 1
                ;;

              *)
                sleep 20
                ;;
            esac
          done

          echo "Timed out waiting for Terraform."
          echo "Next scheduled run will check job status."
          exit 1
